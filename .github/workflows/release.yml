{
  "name": "Ferrum release candidates (draft only)",
  "on": {
    "workflow_dispatch": {},
    "push": {
      "tags": [
        "v*"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "build": {
      "runs-on": "windows-2022",
      "timeout-minutes": 45,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec",
          "with": {
            "toolchain": "1.99.1",
            "components": "rustfmt, clippy"
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0",
          "with": {
            "key": "windows-x64-static-crt-release-v1"
          }
        },
        {
          "name": "Audit tracked publication files",
          "run": "python scripts/audit_publication.py . --tracked"
        },
        {
          "name": "Packaging policy tests",
          "run": "python -m unittest discover -s packaging/tests -v"
        },
        {
          "name": "Build installer and portable/source ZIPs",
          "run": "if ($env:GITHUB_REF -like 'refs/tags/*') { ./scripts/release.ps1 -ExpectedTag $env:GITHUB_REF_NAME } else { ./scripts/release.ps1 }"
        },
        {
          "name": "Store reviewable assets",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "ferrum-release-candidate",
            "path": "dist/v*/",
            "if-no-files-found": "error",
            "compression-level": 0
          }
        }
      ]
    },
    "draft-release": {
      "needs": "build",
      "if": "github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.FERRUM_ENABLE_DRAFT_RELEASES == 'true'",
      "runs-on": "windows-2022",
      "environment": "public-beta",
      "permissions": {
        "contents": "write"
      },
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "ferrum-release-candidate",
            "path": "release-assets"
          }
        },
        {
          "name": "Verify approval and create/update only a draft prerelease",
          "env": {
            "GH_TOKEN": "${{ github.token }}"
          },
          "run": "./scripts/Assert-ReleaseReady.ps1\n$tag = $env:GITHUB_REF_NAME\n$version = $tag.Substring(1)\n$dir = 'release-assets'\nforeach ($line in Get-Content \"$dir/SHA256SUMS.txt\") {\n  $parts = $line -split '  ',2\n  if ([IO.Path]::GetFileName($parts[1]) -cne $parts[1]) { throw 'Unsafe asset filename' }\n  if ((Get-FileHash -LiteralPath (Join-Path $dir $parts[1]) -Algorithm SHA256).Hash.ToLower() -cne $parts[0]) { throw 'Asset checksum mismatch' }\n}\n$existing = gh release view $tag --repo $env:GITHUB_REPOSITORY --json isDraft 2>$null\nif ($LASTEXITCODE -eq 0) {\n  if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'Refusing to replace an already-public release' }\n} else {\n  gh release create $tag --repo $env:GITHUB_REPOSITORY --verify-tag --draft --prerelease --title \"Ferrum v$version\" --notes-file \"$dir/RELEASE_NOTES.md\"\n  if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }\n}\ngh release upload $tag --repo $env:GITHUB_REPOSITORY --clobber \"$dir/Ferrum-v$version-windows-x64-setup.exe\" \"$dir/Ferrum-v$version-windows-x64-portable.zip\" \"$dir/Ferrum-v$version-source.zip\" \"$dir/SHA256SUMS.txt\" \"$dir/RELEASE_NOTES.md\"\nif ($LASTEXITCODE -ne 0) { throw 'Draft release upload failed' }\n"
        }
      ]
    }
  }
}
