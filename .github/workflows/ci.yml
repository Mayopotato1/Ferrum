{
  "name": "Ferrum validation",
  "on": {
    "pull_request": {},
    "push": {
      "branches": [
        "main",
        "master"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "validate": {
      "runs-on": "windows-2022",
      "timeout-minutes": 40,
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec",
          "with": {
            "toolchain": "1.99.1",
            "components": "rustfmt, clippy"
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0",
          "with": {
            "key": "windows-x64-static-crt-release-v1"
          }
        },
        {
          "name": "Audit tracked publication files",
          "run": "python scripts/audit_publication.py . --tracked"
        },
        {
          "name": "Packaging policy tests",
          "run": "python -m unittest discover -s packaging/tests -v"
        },
        {
          "name": "Format, strict Clippy, tests, relevance and release build",
          "run": "./scripts/Build-Release.ps1"
        }
      ]
    }
  }
}
